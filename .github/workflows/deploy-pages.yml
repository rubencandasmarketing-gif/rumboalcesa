name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true activa GitHub Pages si aun no lo esta,
      # asi no hace falta tocar Settings -> Pages a mano.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # WEB LANZADA (25 de noviembre de 2026): la web real se publica en la raiz
      # del dominio. Se copia todo el repositorio menos lo interno.
      # El juego vive en /juego/, sin enlaces y con noindex.
      - name: Montar sitio
        run: |
          mkdir _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' \
            --exclude='./CLAUDE.md' --exclude='./README.md' --exclude='./img/tienda/LEEME.md' \
            -cf - . | tar -xf - -C _site
          echo "rumboalcesa.es" > _site/CNAME

      # GitHub Pages deja cachear 10 min. Cada despliegue marca el CSS y los
      # modulos JS con el commit (?v=abc1234): el navegador los ve como
      # archivos nuevos y el cambio se ve al momento. Solo en la copia que
      # se publica; el repositorio no cambia.
      - name: Marcar version en CSS y JS
        run: |
          V="${GITHUB_SHA::7}"
          cd _site
          sed -i -E "s#(href=\"css/estilo\.css)\"#\1?v=$V\"#; s#(src=\"js/app\.js)\"#\1?v=$V\"#" *.html
          sed -i -E "s#(from +|import\()([\"'])(\./[^\"'?]+\.js)\2#\1\2\3?v=$V\2#g" js/*.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
