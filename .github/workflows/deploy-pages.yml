name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true activa GitHub Pages si aun no lo esta,
      # asi no hace falta tocar Settings -> Pages a mano.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # MODO "PROXIMAMENTE" (mientras se termina la web real):
      #   rumboalcesa.es/                          -> carpeta proximamente/
      #   rumboalcesa.es/vista-previa-p623z9u80x/  -> la web real, noindex
      # El repositorio es publico: la carpeta no es secreta para quien lea
      # este archivo, solo evita que se llegue por casualidad o por Google.
      # PARA LANZAR LA WEB REAL: borrar este paso y el siguiente, y volver a
      # "path: ." con el paso "Marcar version" sobre *.html y js/*.js.
      - name: Montar sitio (Proximamente en la raiz, web real en la vista previa)
        run: |
          PREVIA="vista-previa-p623z9u80x"
          mkdir -p "_site/$PREVIA"
          cp -r proximamente/. _site/
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' \
            --exclude='./proximamente' --exclude='./CLAUDE.md' --exclude='./README.md' \
            --exclude='./apps-script.gs' --exclude='./_headers' --exclude='./robots.txt' \
            -cf - . | tar -xf - -C "_site/$PREVIA"
          # La vista previa no se indexa
          sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n  <meta name="robots" content="noindex, nofollow">#' "_site/$PREVIA"/*.html
          # Raiz: indexable, dominio propio y 404 con la portada de Proximamente
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          echo "rumboalcesa.es" > _site/CNAME
          sed 's#<head>#<head>\n  <base href="/">#' _site/index.html > _site/404.html

      # GitHub Pages deja cachear 10 min. Cada despliegue marca el CSS y los
      # modulos JS con el commit (?v=abc1234): el navegador los ve como
      # archivos nuevos y el cambio se ve al momento. Solo en la copia que
      # se publica; el repositorio no cambia.
      - name: Marcar version en CSS y JS
        run: |
          V="${GITHUB_SHA::7}"
          cd _site/vista-previa-p623z9u80x
          sed -i -E "s#(href=\"css/estilo\.css)\"#\1?v=$V\"#; s#(src=\"js/app\.js)\"#\1?v=$V\"#" *.html
          sed -i -E "s#(from +|import\()([\"'])(\./[^\"'?]+\.js)\2#\1\2\3?v=$V\2#g" js/*.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
